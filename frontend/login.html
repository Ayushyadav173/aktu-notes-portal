<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login | AKTU Notes Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
<main class="login-wrap">
  <div class="login-card">
    <a class="brand" href="/index.html"><span class="brand-mark" aria-hidden="true"></span>AKTU Notes</a>
    <h1 style="font-size:1.6rem">Admin login</h1>
    <form id="loginForm" novalidate>
      <div id="loginAlert" role="alert"></div>
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </div>
</main>
<div id="toasts" aria-live="polite"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
